{% extends 'base.html' %}
{% block content %}
<div class="form-container">
  <h2>Edit Business ID: {{ profile.display_name }}</h2>
  {% if profile.qr_code %}
  <section class="profile-qr-code" aria-label="Generated profile QR code">
    <img class="qr-image" src="{{ profile.qr_code.url }}" alt="QR code linking to {{ profile.display_name }}'s profile">
    <a href="{{ profile.qr_code.url }}" download="{{ profile.slug }}-qr.png">Download QR code</a>
  </section>
  {% endif %}
  <form class="styled-form" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn-primary" type="submit">Save Business ID</button>
    <a href="{% url 'dashboard_home' %}">Cancel</a>
  </form>
</div>
{% endblock %}
