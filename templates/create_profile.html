{% extends 'base.html' %}
{% block content %}
<div class="form-container">
  <h2>Create Digital Profile</h2>
  <form class="styled-form" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn-primary" type="submit">Create Profile</button>
    <a href="{% url 'dashboard_home' %}">Cancel</a>
  </form>
</div>
{% endblock %}
